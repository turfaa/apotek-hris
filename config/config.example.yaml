database:
  host: localhost
  port: 5432
  db_name: apotek_hris
  ssl_mode: false

server:
  port: 8080
  host: 0.0.0.0 

# Printed on the letterhead of pay slips (slip gaji). Optional: until every
# field is set, pay slip PDFs answer 503.
pharmacy:
  name: Apotek Contoh
  license_number: "0000000000"
  address: Jalan Contoh No. 1, Kota Contoh
  email: kontak@example.com
  phone: "0800000000"

# vmedis-proxy-api, which salary snapshots are posted to the Vmedis journal
# (Data Jurnal Keuangan) through.
vmedis_proxy:
  base_url: http://backend-server.vmedis/api

# The Vmedis account codes (akkode) salary journal entries use.
journal:
  accounts:
    bank: "111004"                # Bank OCBC
    salary_expense: "610002"      # Gaji Karyawan
    employee_receivable: "171001" # Piutang Pegawai
